name: ci
on: [push, pull_request]
jobs:
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql postgresql-contrib
      - name: 848 database cases + 14 report checks
        run: sudo env "PATH=$(ls -d /usr/lib/postgresql/*/bin | tail -1):$PATH" bash tools/db_tests/run_db_tests.sh
  python-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pytest hypothesis python-dateutil phonenumbers && pytest -q tools/reference
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci && npx tsc -b && npm test && npm run build
      - run: cd ../tools/reference && npm install && node test_golden.mjs
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: maven }
      - name: Docker API version for Testcontainers (Docker 29 needs >= 1.40)
        run: echo 'api.version=1.44' > ~/.docker-java.properties
      - run: mvn -B verify
        working-directory: backend
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_DB: galla, POSTGRES_USER: galla, POSTGRES_PASSWORD: galla }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U galla" --health-interval 5s --health-retries 10
    env:
      E2E_DB_URL: postgresql://galla:galla@localhost:5432/galla
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: maven }
      - run: mvn -B -q -DskipTests package
        working-directory: backend
      - name: Start API
        run: |
          GALLA_JWT_SECRET=e2e-tenant-secret-e2e-tenant-secret-1 GALLA_PLATFORM_JWT_SECRET=e2e-platform-secret-e2e-platform-secret-2 \
          GALLA_COOKIE_SECURE=false GALLA_BOOTSTRAP_ADMIN_EMAIL=root@galla.test GALLA_BOOTSTRAP_ADMIN_PASSWORD=super-admin-pass-1 \
          nohup java -jar backend/target/galla-api-0.1.0.jar > api.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8080/actuator/health && break; sleep 2; done
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci && npm run build && (nohup npx vite preview --port 4173 > ../web.log 2>&1 &)
        working-directory: frontend
      - run: npm install && npx playwright install --with-deps chromium && node run.mjs
        working-directory: e2e
        env: { E2E_DB_URL: "postgresql://galla:galla@localhost:5432/galla" }
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots-and-logs
          path: |
            e2e/shots
            api.log
