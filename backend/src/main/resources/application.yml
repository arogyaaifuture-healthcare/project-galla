spring:
  datasource: { url: "${DB_URL:jdbc:postgresql://localhost:5432/galla}", username: "${DB_USER:galla}", password: "${DB_PASSWORD:galla}", hikari: { maximum-pool-size: "${DB_POOL:10}" } }
  jpa: { hibernate: { ddl-auto: validate }, open-in-view: false }
  flyway: { enabled: true }
management: { endpoints: { web: { exposure: { include: "health,info,prometheus" } } }, endpoint: { health: { probes: { enabled: true } } } }
server: { shutdown: graceful }
app: { brand: { name: "${BRAND_NAME:Galla}" } }
